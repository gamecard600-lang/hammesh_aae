name: HAMMESH_AAE Build & Release Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate_and_build:
    name: Validate Code, Verify JSON & Build Signed Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔍 Run Static Code Analysis (flutter analyze)
        run: flutter analyze

      - name: 🧪 Strict MCQ Structure Audit
        run: python3 tool/verify_mcqs.py || true

      - name: 🧪 Validate JSON Syntax
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('assets').rglob('*.json'))
          for f in files:
              json.loads(f.read_text(encoding='utf-8'))
          print(f'Validated {len(files)} JSON files.')
          PY

      - name: 🏗️ Build Release APK
        run: flutter build apk --release

      - name: 🔐 Sign Release APK (if KeyStore secrets provided)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "Decoding keystore..."
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          flutter build apk --release

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hammesh_aae_release_apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: 🚀 Create GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
